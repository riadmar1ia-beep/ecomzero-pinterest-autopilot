name: ECOM-ZERO Pinterest Autopilot (Buffer Free)

# Activation autonome quotidienne (MISSION ECOM-ZERO-PINTEREST-05) :
# - Déclenchement manuel (workflow_dispatch) : dry-run par défaut.
# - Déclenchement planifié (schedule) : mode LIVE automatique (1 épingle max/jour, réserve cible 7, plafond Free 10).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution manuel (dry-run par défaut)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
  schedule:
    - cron: "0 17 * * *"  # 17:00 UTC chaque jour (18:00 CET / 19:00 CEST) — 0 € sur dépôt public

permissions:
  contents: write

concurrency:
  group: pinterest-autopilot-queue
  cancel-in-progress: false

jobs:
  replenish-pinterest-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal dependencies (requirements.txt)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit & simulation safety checks
        run: python -m pytest tests/test_pinterest_pipeline.py -v

      - name: Renew content catalog and host new PNGs if reserve < 3 (live / schedule only)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'live'
        run: |
          python -m pipeline.run_autopilot --renew-catalog
          git config user.name "ecomzero-bot"
          git config user.email "bot@ecom-zero.local"
          git add catalog/guides_catalog.json out/pins/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(pinterest): auto-renew catalog and host new pin PNGs"
            git push
            sleep 5
          fi

      - name: Run Pinterest queue replenisher (schedule=live, manual=dry-run default)
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ vars.BUFFER_PINTEREST_CHANNEL_ID || '6b0854348541f09ecbb1427e' }}
          PIN_IMAGE_BASE_URL: ${{ secrets.PIN_IMAGE_BASE_URL || 'https://raw.githubusercontent.com/riadmar1ia-beep/ecomzero-pinterest-autopilot/main/out/pins' }}
          ALLOW_LIVE_SCHEDULE: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'live') && '1' || '0' }}
        run: |
          if [ "$ALLOW_LIVE_SCHEDULE" = "1" ]; then
            python -m pipeline.run_autopilot --live
          else
            python -m pipeline.run_autopilot --dry-run
          fi

      - name: Commit updated state after live scheduling
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'live'
        run: |
          git config user.name "ecomzero-bot"
          git config user.email "bot@ecom-zero.local"
          git add state/published_history.json || true
          git diff --cached --quiet || (git commit -m "chore(pinterest): update scheduled state" && git push)

      - name: Capture commercial metrics snapshot (read-only D1 + Buffer)
        if: always()
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ vars.BUFFER_PINTEREST_CHANNEL_ID || '6b0854348541f09ecbb1427e' }}
        run: python -m pipeline.run_autopilot --metrics-snapshot || true

      - name: Upload execution & metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-autopilot-logs
          path: |
            out/run_log.json
            out/metrics_snapshot.json
          retention-days: 14
